<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CCF | ሰውን መርዳት</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,"Noto Sans Ethiopic",sans-serif;
  background:#f6f9fc;
  color:#182536;
  line-height:1.8;
}

:root{
  --blue:#0868a8;
  --dark:#092d49;
  --green:#16a477;
  --light:#edf7fc;
  --white:#fff;
  --text:#637386;
  --shadow:0 15px 45px rgba(9,45,73,.10);
}

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);
  box-shadow:0 2px 18px rgba(0,0,0,.07);
}

.navbar{
  max-width:1200px;
  margin:auto;
  padding:16px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:30px;
  font-weight:900;
  color:var(--blue);
}

.logo span{
  font-size:30px;
}

nav{
  display:flex;
  gap:25px;
}

nav a{
  text-decoration:none;
  color:#263746;
  font-weight:bold;
  transition:.3s;
}

nav a:hover{
  color:var(--blue);
}

.hero{
  min-height:88vh;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  overflow:hidden;

  background:

  url("file_00000000239c82088d3e82de78c3d8b2.png");

  background-size:cover;
  background-position:center;
}

.hero-content{
  max-width:850px;
  padding:60px 22px;
}

.badge{
  display:inline-block;
  padding:9px 20px;
  border:1px solid rgba(255,255,255,.6);
  border-radius:50px;
  margin-bottom:25px;
  font-weight:bold;
  font-size:15px;
}

.hero h1{
  font-size:64px;
  line-height:1.1;
  margin-bottom:22px;
  font-weight:900;
}

.hero h2{
  font-size:30px;
  margin-bottom:20px;
}

.hero p{
  font-size:20px;
  max-width:720px;
  margin:auto;
  opacity:.95;
}

.buttons{
  margin-top:32px;
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
}

.btn{
  display:inline-block;
  padding:14px 30px;
  border-radius:50px;
  text-decoration:none;
  font-weight:bold;
  transition:.3s;
}

.btn-primary{
  background:white;
  color:var(--blue);
}

.btn-outline{
  color:white;
  border:2px solid white;
}

.btn:hover{
  transform:translateY(-3px);
}

section{
  padding:90px 22px;
}

.container{
  max-width:1150px;
  margin:auto;
}

.section-title{
  text-align:center;
  margin-bottom:50px;
}

.section-title .small{
  color:var(--green);
  font-weight:bold;
  margin-bottom:8px;
}

.section-title h2{
  font-size:40px;
  color:var(--blue);
  margin-bottom:12px;
}

.section-title p{
  color:var(--text);
  max-width:650px;
  margin:auto;
}

.about{
  background:white;
}

.about-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:55px;
  align-items:center;
}

.about-image{
  width:100%;
  border-radius:28px;
  box-shadow:var(--shadow);
}

.about-text h3{
  font-size:30px;
  color:var(--dark);
  margin-bottom:18px;
}

.about-text p{
  color:var(--text);
  margin-bottom:18px;
}

.info-box{
  margin-top:25px;
  padding:20px;
  border-left:5px solid var(--green);
  background:#eef8f5;
  border-radius:0 16px 16px 0;
  font-weight:bold;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}

.card{
  background:white;
  padding:38px 28px;
  border-radius:24px;
  box-shadow:var(--shadow);
  text-align:center;
  transition:.3s;
  border:1px solid #edf1f5;
}

.card:hover{
  transform:translateY(-8px);
}

.icon{
  width:75px;
  height:75px;
  margin:0 auto 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#eaf6fc;
  font-size:38px;
}

.card h3{
  color:var(--blue);
  font-size:24px;
  margin-bottom:12px;
}

.card p{
  color:var(--text);
}

.programs{
  background:var(--light);
}

.program-card{
  text-align:left;
  padding:30px;
}

.program-card .icon{
  margin:0 0 18px;
}

.program-card h3{
  margin-bottom:10px;
}

.values{
  background:white;
}

.value-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.value{
  padding:25px;
  border-radius:20px;
  background:#f7fafc;
  border:1px solid #e8eef3;
}

.value strong{
  display:block;
  color:var(--blue);
  font-size:21px;
  margin-bottom:7px;
}
