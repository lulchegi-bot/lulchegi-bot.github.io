<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCF | ሰውን መርዳት</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,"Noto Sans Ethiopic",sans-serif;
  background:#f5f9fc;
  color:#16324a;
  line-height:1.75;
}

a{
  text-decoration:none;
  color:inherit;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  box-shadow:0 4px 20px #0001;
  padding:14px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:29px;
  font-weight:900;
  color:#0868a8;
}

.logo span{
  font-size:30px;
}

nav{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
}

nav a{
  color:#234;
  font-weight:700;
  padding:7px 9px;
  border-radius:18px;
}

nav a:hover{
  color:#087b83;
  background:#edf8f7;
}

/* HERO */
.hero{
  min-height:86vh;
  display:flex;
  align-items:center;
  padding:70px 7%;
  color:#fff;
  position:relative;
  overflow:hidden;
  background:
  linear-gradient(100deg,#044d77ee,#059167b8),
  url("file_00000000239c82088d3e82de78c3d8b2.png")
  center/cover;
}

.hero-content{
  max-width:780px;
}

.badge{
  display:inline-block;
  border:1px solid #ffffff99;
  padding:7px 16px;
  border-radius:30px;
  font-weight:700;
  margin-bottom:20px;
}

.hero h1{
  font-size:clamp(52px,9vw,82px);
  line-height:1;
  margin-bottom:12px;
}

.hero h2{
  font-size:clamp(25px,5vw,42px);
  margin-bottom:16px;
}

.hero p{
  font-size:19px;
  max-width:680px;
}

.buttons{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  margin-top:28px;
}

.btn{
  display:inline-block;
  padding:13px 25px;
  border-radius:30px;
  font-weight:800;
  border:2px solid #fff;
  transition:.25s;
}

.btn:hover{
  transform:translateY(-3px);
}

.primary{
  background:#fff;
  color:#0868a8;
}

.secondary{
  color:#fff;
  background:transparent;
}

.donate-btn{
  background:#ffc400;
  border-color:#ffc400;
  color:#25343c;
}

/* GENERAL */
section{
  padding:78px 7%;
}

.title{
  text-align:center;
  max-width:760px;
  margin:0 auto 42px;
}

.title h2{
  font-size:38px;
  color:#0868a8;
  margin-bottom:8px;
}

.title p{
  color:#65798b;
  font-size:17px;
}

/* ABOUT */
.about{
  background:#fff;
}

.about-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:45px;
  align-items:center;
}

.about-text h3{
  font-size:30px;
  color:#0868a8;
  margin-bottom:15px;
}

.about-text p{
  color:#4e6475;
  margin-bottom:15px;
}

.highlight{
  background:#edf8ff;
  border-left:5px solid #0868a8;
  padding:20px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}

.about-image img{
  width:100%;
  border-radius:24px;
  box-shadow:0 18px 45px #0002;
}

/* CARDS */
.mission{
  background:#eef8ff;
}

.cards{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(220px,1fr));
  gap:22px;
}

.card{
  background:#fff;
  padding:28px 22px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 8px 28px #00000012;
  transition:.25s;
  cursor:pointer;
}

.card:hover{
  transform:translateY(-7px);
  box-shadow:0 16px 35px #0000001f;
}

.icon{
  font-size:44px;
  margin-bottom:10px;
}

.card h3{
  color:#0868a8;
  font-size:21px;
  margin-bottom:7px;
}

.card p{
  color:#65798b;
}

/* STATS */
.stats{
  background:linear-gradient(135deg,#0868a8,#0a9b70);
  color:#fff;
}

.stats .title h2{
  color:#fff;
}

.stats .title p{
  color:#e6f7f2;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:42px;
}

/* GALLERY */
.gallery{
  background:#fff;
}

.gallery-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.gallery-item{
  position:relative;
  overflow:hidden;
  border-radius:20px;
  box-shadow:0 8px 25px #0000001f;
}

.gallery-item img{
  width:100%;
  height:270px;
  object-fit:cover;
  display:block;
  transition:.4s;
}

.gallery-item:hover img{
  transform:scale(1.07);
}

.gallery-caption{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:30px 16px 15px;
  color:#fff;
  font-weight:800;
  background:linear-gradient(transparent,#000d);
}

/* VALUES */
.values{
  background:#f5f9fc;
}

/* DONATION */
.donate{
  background:linear-gradient(135deg,#fff7ed,#eaf8f3);
}

.donate-box{
  max-width:950px;
  margin:auto;
  background:#fff;
  border-radius:26px;
  padding:32px;
  text-align:center;
  box-shadow:0 12px 40px #00000017;
}

.methods{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-top:22px;
}

.method{
  padding:20px;
  border-radius:18px;
  background:#f7fafc;
}

.method h4{
  color:#0868a8;
  font-size:19px;
}

/* CONTACT */
.contact{
  background:#eaf5ff;
}

.contact-box{
  max-width:900px;
  margin:auto;
  background:#fff;
  padding:32px;
  border-radius:24px;
  box-shadow:0 10px 35px #00000014;
}

.contact-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.contact-item{
  text-align:center;
  padding:20px;
  border-radius:16px;
  background:#f7fafc;
}

.contact-item .icon{
  font-size:31px;
}

.contact-item h3{
  color:#0868a8;
  margin-bottom:4px;
}

.contact-item a{
  color:#0868a8;
  font-weight:800;
  word-break:break-word;
}

/* FOOTER */
footer{
  background:#102f47;
  color:#fff;
  text-align:center;
  padding:42px 7%;
}

.footer-logo{
  font-size:30px;
  font-weight:900;
  margin-bottom:10px;
}

.footer-text{
  color:#c9d8e3;
}

/* MODALS */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#082334b8;
  z-index:2000;
  padding:18px;
  align-items:center;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:#fff;
  width:min(620px,100%);
  max-height:86vh;
  overflow:auto;
  border-radius:24px;
  padding:30px;
  position:relative;
  box-shadow:0 25px 70px #0005;
}

.modal-box h2{
  color:#0868a8;
  margin:8px 0 14px;
}

.modal-box p{
  color:#4e6475;
  font-size:17px;
  margin-bottom:10px;
}
