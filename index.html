<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CCF Helping People</title>

<meta name="description"
content="CCF is committed to helping people, supporting families and strengthening communities through compassion, dignity and meaningful action.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

:root{
    --blue:#071d33;
    --blue2:#0c2d4c;
    --orange:#f39a3d;
    --light:#f6f8fa;
    --white:#ffffff;
    --text:#263746;
    --muted:#6d7b87;
    --border:#e8edf1;
}

body{
    font-family:"Inter","Noto Sans Ethiopic",sans-serif;
    color:var(--text);
    background:#fff;
    line-height:1.7;
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    width:100%;
    display:block;
}

.container{
    width:min(1160px,92%);
    margin:auto;
}

/* ================= HEADER ================= */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    background:rgba(7,29,51,.97);
    backdrop-filter:blur(10px);
}

.navbar{
    min-height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    color:white;
    font-size:21px;
    font-weight:800;
    letter-spacing:.3px;
}

.logo-mark{
    width:42px;
    height:42px;
    border-radius:50%;
    background:var(--orange);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:20px;
    font-weight:800;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:28px;
}

.nav-links a{
    color:#fff;
    font-size:14px;
    font-weight:600;
    transition:.3s;
}

.nav-links a:hover{
    color:var(--orange);
}

.nav-donate{
    background:var(--orange);
    padding:11px 18px;
    border-radius:4px;
}

.menu-btn{
    display:none;
    border:0;
    background:none;
    color:white;
    font-size:29px;
    cursor:pointer;
}

/* ================= HERO ================= */

.hero{
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:center;
    background-image:
        linear-gradient(rgba(4,20,35,.73),rgba(4,20,35,.82)),
        url("file_00000000239c82088d3e82de78c3d8b2.png");
    background-size:cover;
    background-position:center;
}

.hero-content{
    max-width:760px;
    color:white;
    padding-top:70px;
}

.hero-label{
    color:var(--orange);
    text-transform:uppercase;
    letter-spacing:3px;
    font-size:13px;
    font-weight:700;
    margin-bottom:18px;
}

.hero h1{
    font-size:clamp(42px,7vw,76px);
    line-height:1.08;
    font-weight:800;
    margin-bottom:25px;
}

.hero h1 span{
    color:var(--orange);
}

.hero p{
    font-size:18px;
    color:#e6edf2;
    max-width:680px;
    margin-bottom:34px;
}

.btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:var(--orange);
    color:white;
    padding:14px 24px;
    border-radius:4px;
    font-weight:700;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.05);
}

/* ================= GENERAL ================= */

section{
    padding:100px 0;
}

.section-label{
    display:inline-block;
    color:var(--orange);
    font-size:13px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:14px;
}

.section-title{
    color:var(--blue);
    font-size:clamp(32px,5vw,48px);
    line-height:1.15;
    margin-bottom:20px;
}

.section-text{
    color:var(--muted);
    max-width:720px;
}

.center{
    text-align:center;
}

.center .section-text{
    margin:auto;
}

/* ================= ABOUT ================= */

.about{
    background:white;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:70px;
    align-items:center;
}

.about-image{
    height:560px;
    overflow:hidden;
    border-radius:4px;
}

.about-image img{
    height:100%;
    object-fit:cover;
}

.about-content p{
    margin-bottom:18px;
    color:var(--muted);
}

.tabs{
    display:flex;
    gap:8px;
    margin:30px 0 20px;
    flex-wrap:wrap;
}

.tab-btn{
    border:1px solid var(--border);
    background:white;
    padding:10px 17px;
    cursor:pointer;
    font-weight:700;
    color:var(--blue);
    border-radius:3px;
}

.tab-btn.active{
    background:var(--orange);
    color:white;
    border-color:var(--orange);
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

/* ================= WHAT WE DO ================= */

.what-we-do{
    background:var(--light);
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:24px;
    margin-top:50px;
}

.card{
    background:white;
    padding:34px 28px;
    border:1px solid var(--border);
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px);
    box-shadow:0 18px 40px rgba(7,29,51,.08);
}

.icon{
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--orange);
    font-size:30px;
    border:1px solid #f2d5b6;
    margin-bottom:24px;
}

.card h3{
    color:var(--blue);
    font-size:21px;
    margin-bottom:12px;
}

.card p{
    color:var(--muted);
    font-size:15px;
}

/* ================= MISSION VISION ================= */

.mission{
    background:var(--blue);
    color:white;
}

.mission .section-title{
    color:white;
}

.mv-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
    margin-top:45px;
}

.mv-card{
    padding:38px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.04);
}

.mv-card h3{
    color:var(--orange);
    font-size:24px;
    margin-bottom:15px;
}

.mv-card p{
    color:#d9e3eb;
}

/* ================= PROGRAMS ================= */

.programs{
    background:white;
}

.program-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-top:50px;
}

.program{
    border:1px solid var(--border);
    padding:30px 24px;
    text-align:center;
    background:white;
}

.program .icon{
    margin:0 auto 20px;
}

.program h3{
    color:var(--blue);
    font-size:19px;
    margin-bottom:12px;
}

.program p{
    color:var(--muted);
    font-size:14px;
    margin-bottom:20px;
}

.learn{
    color:var(--orange);
    font-weight:800;
    font-size:14px;
}

/* ================= VALUES ================= */

.values{
    background:var(--light);
}

.values-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-top:50px;
}

.value{
    background:white;
    padding:30px 23px;
    border-top:3px solid var(--orange);
}

.value h3{
    color:var(--blue);
    margin-bottom:12px;
}

.value p{
    color:var(--muted);
    font-size:14px;
}

/* ================= IMPACT ================= */

.impact{
    position:relative;
    color:white;
    background-image:
        linear-gradient(rgba(0,0,0,.70),rgba(0,0,0,.78)),
        url("file_000000006d988208b497db0eb8080237.png");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

.impact .section-title{
    color:white;
}

.impact-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-top:50px;
}

.impact-item{
    text-align:center;
    padding:35px 20px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(0,0,0,.20);
}

.impact-item .big{
    color:var(--orange);
    font-size:45px;
    font-weight:800;
    margin-bottom:8px;
}

.impact-item h3{
    font-size:19px;
    margin-bottom:8px;
}

.impact-item p{
    color:#dce3e8;
    font-size:14px;
}

/* ================= DONATE ================= */

.donate{
    background:var(--orange);
    color:white;
}

.donate-grid{
    display:grid;
    grid-template-columns:1.2fr .8fr;
    gap:50px;
    align-items:center;
}

.donate h2{
    font-size:clamp(32px,5vw,50px);
    line-height:1.15;
    margin-bottom:20px;
}

.donate p{
    color:#fff7ef;
    margin-bottom:25px;
}

.bank-box{
    background:white;
    color:var(--blue);
    padding:30px;
    border-radius:4px;
}

.bank-box h3{
    margin-bottom:20px;
}

.account{
    font-size:28px;
    font-weight:800;
    letter-spacing:1px;
    margin-bottom:18px;
}

.copy-btn{
    border:0;
    background:var(--blue);
    color:white;
    padding:11px 18px;
    cursor:pointer;
    border-radius:3px;
    font-weight:700;
}

/* ================= GALLERY ================= */

.gallery{
    background:white;
}

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-top:45px;
}
