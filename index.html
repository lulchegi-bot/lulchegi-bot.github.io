<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CCF | ሰውን መርዳት</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Arial,"Noto Sans Ethiopic",sans-serif;
background:#f5f9fc;
color:#17324d;
line-height:1.7;
}

:root{
--blue:#0868a8;
--green:#16a477;
--dark:#073b5c;
--light:#eaf6ff;
--white:#fff;
}

/* HEADER */

header{
position:sticky;
top:0;
z-index:1000;
background:rgba(255,255,255,.97);
box-shadow:0 3px 20px rgba(0,0,0,.10);
padding:14px 6%;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
display:flex;
align-items:center;
gap:9px;
font-size:29px;
font-weight:900;
color:var(--blue);
}

.logo span{
font-size:31px;
}

nav{
display:flex;
gap:22px;
}

nav a{
text-decoration:none;
color:#18384e;
font-weight:bold;
transition:.3s;
}

nav a:hover{
color:var(--green);
}

/* HERO */

.hero{
min-height:88vh;
display:flex;
align-items:center;
padding:70px 7%;
color:white;
background:
linear-gradient(90deg,rgba(3,58,91,.94),rgba(8,104,168,.62)),
url("file_00000000239c82088d3e82de78c3d8b2.png");
background-size:cover;
background-position:center;
}

.hero-content{
max-width:760px;
}

.badge{
display:inline-block;
padding:8px 18px;
border:1px solid rgba(255,255,255,.6);
border-radius:30px;
margin-bottom:20px;
font-weight:bold;
background:rgba(255,255,255,.10);
}

.hero h1{
font-size:64px;
font-weight:900;
margin-bottom:8px;
}

.hero h2{
font-size:31px;
margin-bottom:18px;
}

.hero p{
font-size:19px;
max-width:650px;
}

.buttons{
display:flex;
gap:14px;
flex-wrap:wrap;
margin-top:30px;
}

.btn{
display:inline-block;
padding:14px 27px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
transition:.3s;
}

.btn:hover{
transform:translateY(-3px);
}

.btn-primary{
background:white;
color:var(--blue);
}

.btn-secondary{
border:2px solid white;
color:white;
}

/* GENERAL */

section{
padding:85px 7%;
}

.title{
text-align:center;
max-width:760px;
margin:0 auto 48px;
}

.title h2{
font-size:38px;
color:var(--blue);
margin-bottom:10px;
}

.title p{
color:#617789;
font-size:17px;
}

/* ABOUT */

.about{
background:white;
}

.about-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:45px;
align-items:center;
}

.about-text h3{
font-size:31px;
color:var(--blue);
margin-bottom:15px;
}

.about-text p{
color:#526a7a;
margin-bottom:17px;
}

.highlight{
padding:20px;
border-left:5px solid var(--green);
background:#effaf6;
border-radius:12px;
font-weight:bold;
}

.about-image img{
width:100%;
height:420px;
object-fit:cover;
border-radius:25px;
box-shadow:0 18px 45px rgba(0,0,0,.18);
}

/* CARDS */

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:24px;
}

.card{
background:white;
padding:30px 23px;
border-radius:20px;
box-shadow:0 8px 28px rgba(0,0,0,.07);
text-align:center;
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 16px 35px rgba(0,0,0,.13);
}

.icon{
font-size:46px;
margin-bottom:12px;
}

.card h3{
font-size:21px;
color:var(--blue);
margin-bottom:9px;
}

.card p{
color:#687d8c;
}

/* MISSION */

.mission{
background:#edf8ff;
}

/* PROGRAMS */

.programs{
background:white;
}

/* FEATURE IMAGE */

.feature{
margin-top:45px;
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

.feature img{
width:100%;
height:300px;
object-fit:cover;
border-radius:22px;
box-shadow:0 10px 30px rgba(0,0,0,.12);
}

/* STATS */

.stats{
background:linear-gradient(135deg,#0868a8,#16a477);
color:white;
}

.stats .title h2{
color:white;
}

.stats .title p{
color:#e7f7ff;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;
text-align:center;
}

.stat{
padding:25px;
background:rgba(255,255,255,.10);
border-radius:18px;
}

.stat strong{
display:block;
font-size:43px;
margin-bottom:5px;
}

/* GALLERY */

.gallery
