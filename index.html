<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ethiopia AI</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101010;
  color: white;
  text-align: center;
}
header {
  background: #181818;
  padding: 20px;
  font-size: 25px;
  font-weight: bold;
}
#chat {
  padding: 20px;
  min-height: 55vh;
}
.message {
  padding: 14px;
  margin: 12px auto;
  border-radius: 15px;
  max-width: 85%;
  background: #292929;
  text-align: left;
  overflow-wrap: anywhere;
}
.user { background: #075e54; }
button {
  background: #00c853;
  color: black;
  border: none;
  border-radius: 30px;
  padding: 17px 25px;
  font-size: 17px;
  margin: 8px;
}
#status { color: #aaa; }
</style>
</head>

<body>

<header>🤖 Ethiopia AI</header>

<div id="chat">
  <div class="message">
    ሰላም! እኔ Ethiopia AI ነኝ።
    የማይክሮፎን ቁልፉን ተጫንና ተናገረኝ! 🎙️
  </div>
</div>

<p id="status">ዝግጁ ነኝ!</p>

<button onclick="listen()">🎙️ ተናገር</button>
<button onclick="stopSpeaking()">🔇 ዝም በል</button>

<script>
const chat = document.getElementById("chat");
const statusText = document.getElementById("status");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    statusText.textContent = "የድምፅ ማንበብ አይደገፍም።";
    return;
  }

  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "am-ET";
  utterance.rate = 0.9;
  speechSynthesis.speak(utterance);
}

function listen() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    statusText.textContent =
      "ይህ Browser የድምፅ ማወቅን አይደግፍም። Chrome ላይ ሞክር።";
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "am-ET";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    statusText.textContent = "እያዳመጥኩ ነው... 🎧";
  };

  recognition.onresult = (event) => {
    const question = event.results[0][0].transcript;
    addMessage("አንተ: " + question, "user");

    const reply = getReply(question);
    addMessage("Ethiopia AI: " + reply, "bot");
    speak(reply);
  };

  recognition.onerror = () => {
    statusText.textContent =
      "ድምፅህን ማወቅ አልቻልኩም። ማይክሮፎን ፈቃድ ፍቀድ።";
  };

  recognition.onend = () => {
    statusText.textContent = "እንደገና ለመናገር ቁልፉን ተጫን።";
  };

  recognition.start();
}

function getReply(question) {
  const q = question.toLowerCase();

  if (q.includes("ሰላም")) {
    return "ሰላም ጓደኛዬ! እንዴት ነህ?";
  }

  if (q.includes("እንዴት ነህ")) {
    return "ደህና ነኝ፣ አመሰግናለሁ! አንተስ?";
  }

  if (q.includes("ስም")) {
    return "ስሜ Ethiopia AI ነው። አንተን ለመርዳት እዚህ ነኝ!";
  }

  if (q.includes("አመሰግናለሁ")) {
    return "ምንም አይደለም ጓደኛዬ!";
  }

  return "ሰምቻለሁ ጓደኛዬ! ግን ለሁሉም ጥያቄዎች መልስ የሚሰጥ እውነተኛ AI እንድሆን ከAI አገልግሎት ጋር መገናኘት ያስፈልገኛል።";
}

function stopSpeaking() {
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
  statusText.textContent = "ድምፅ ቆሟል።";
}
</script>

</body>
</html>
